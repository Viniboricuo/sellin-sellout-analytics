name: Unpack project zip
on:
  push:
    paths: ['*.zip']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack zip into repo root
        run: |
          shopt -s nullglob dotglob
          mkdir -p /tmp/u
          for z in *.zip; do unzip -oq "$z" -d /tmp/u || true; git rm -q "$z"; done
          d=$(find /tmp/u -mindepth 1 -maxdepth 1 -type d | head -1)
          cp -r "$d"/* .
          git rm -q .github/workflows/unpack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add project files"
          git push
